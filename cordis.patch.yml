# dsh-review bundle patch：把 Host 插件插进当前 profile。
#
# 需要改可调项时，不要改本文件，改 profile 自己的 patch 层
# （~/.dsh/profiles/<profile>/cordis.patch.yml）按 id 覆盖 config，例如：
#
#   - id: review
#     config:
#       defaultMode: strict
#       agents:
#         - preset: codex
#           model: gpt-5.6-sol
#       reviewers:
#         - id: deep-dive
#           kind: subagent
#           provider: spawn            # 子智能体 provider
#           agentProvider: bailian     # 模型来自 DSH 自己的配置
#           agentModel: deepseek-v4.1-flash
#
# 覆盖是整块替换 config（不做深合并），未写的键由插件内置默认值补齐。
- insert:
    - id: review
      name: dsh-review